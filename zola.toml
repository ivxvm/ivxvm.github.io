title="ivxvm.github.io"

# The URL the site will be built for
base_url = "https://ivxvm.github.io"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

theme = "zola-pickles"

[markdown]

[markdown.highlighting]
extra_themes = ["extra/my_rose_pine.json"]
theme = "my-rose-pine"
# theme = "rose-pine"
# style = "class"
# theme = "tokyo-night"

[extra]

## A line to display underneath the main title
# subtitle = "[ tech blog ]"

# Text to display in the footer of the page
# copyright = "Copyright © [ivxvm](https://github.com/ivxvm) 2026"

# Your Google Analytics ID
analytics = ""

# See below
katex_enable = false

# See below
instantpage_enable = false

# Pagefind site search; see below. Requires a build step.
search_enable = false 
